# Same shape as the Vite dev proxy: the browser only talks to this origin, and
# /api/* is forwarded to the backend with the prefix stripped.

# Sign-in attempts: 10 a minute per client address, a burst of 5, then 429.
# Enough for a person, useless for guessing passwords.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    # In production a proxy (Caddy) sits in front; trust the address it reports,
    # only from the private ranges Docker networks use.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:3000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed asset names never change content, so cache them hard; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
